# Known injuries and return-from-injury adjustments, applied on top of the
# games-played model by scripts/project_games_played.py. Hand-edited.
#
# as_of: the date the statuses below were read. Refresh before relying on it.
# Sources (fetched by this project, 2026-10-14):
#   - CBS Sports NBA injury report (cbssports.com/nba/injuries)
#   - Covers NBA injury report (covers.com/sport/basketball/nba/injuries)
#   - ESPN "Biggest injury returns for the 2026-27 NBA season" (syndicated via abc7.com)
#   - ClutchPoints on Porzingis
#
# Fields (all optional):
#   games_missed: games expected to be missed from the start of the season, from a
#                 stated return date. Season opens ~2026-10-21; a team plays ~0.48
#                 games per calendar day, so days_out * 0.48 ~= games missed.
#                 The model GP is then scaled by (82 - games_missed) / 82, because the
#                 model's own injury rate applies to the games that remain.
#   gp_cap:       hard ceiling on projected GP, for multi-season risk the model can't
#                 see (age + major tendon/ligament injury, undisclosed illness).
#   exclude_seasons: history seasons to drop from the GP blend because they were cut
#                 short by an injury that has since healed (otherwise the model reads a
#                 one-off injury as chronic fragility).
#   note:         plain-language status, shown on the draft board.

